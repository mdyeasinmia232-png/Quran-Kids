name: Build Quran Kids Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip QuranKids_AndroidStudio_Project_v2.zip -d project
          find project -name settings.gradle

      - name: Build APK and AAB
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle | head -1)")
          cd "$PROJECT_DIR"
          gradle assembleDebug bundleRelease

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: Quran-Kids-Build
          path: |
            project/**/build/outputs/apk/debug/*.apk
            project/**/build/outputs/bundle/release/*.aabaab
